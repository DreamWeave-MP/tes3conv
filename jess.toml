manifest_version = 1

[package]
id = "org.dreamweave.tes3conv"
version = "0.1.0"
jess_api = "1"
default_target = "tes3conv"
include = ["src"]
tests = [
  "tests/run.luau",
  "tests/records.luau",
  "tests/encode.luau",
  "tests/stream.luau",
  "tests/commands.luau",
  "tests/style.luau",
]

[dependencies]
"org.dreamweave.tes3" = "0.1"

[modules]
"@tes3conv" = "src/init.luau"
# The tes3conv-shaped record helpers, exported for the packages that work on the same record
# tables: merge-to-master, add-vanilla-refs, and starwind.
"@tes3conv/records" = "src/records.luau"
# The conversion as a request and a result, for a front end with no terminal, and the command
# line over it.
"@tes3conv/commands" = "src/commands.luau"
"@tes3conv/cli" = "src/cli.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. `read`, `write`, and a conversion read and write files, so their
# caller needs to.

[[layer]]
id = "tes3conv.core"
requires = ["tes3.core"]
exports = ["@tes3conv", "@tes3conv/records", "@tes3conv/commands", "@tes3conv/cli"]

# The command line: `src/main.luau` hands its arguments to `@tes3conv/cli`. A conversion reads the
# input file and looks for the output and the backups already beside it (filesystem.read); with an
# output it writes the conversion beside it, copies a file already there to its backup, and moves
# the conversion over it (filesystem.write). It reads no environment, runs no other program, and
# opens no connection.

[targets.tes3conv]
kind = "command"
command = "tes3conv"
entry = "src/main.luau"
capabilities = ["filesystem.read", "filesystem.write"]
