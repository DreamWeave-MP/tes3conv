# tes3conv as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `tes3conv-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "aa093a63-c0e6-45e8-bc81-75f076e7c8b3"
slug = "tes3conv"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.tes3conv"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
